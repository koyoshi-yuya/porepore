default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("MYSQL_HOST", "127.0.0.1").to_json %>
  port: <%= ENV.fetch("MYSQL_PORT", 3306) %>
  username: <%= ENV.fetch("MYSQL_USER", "porepore").to_json %>
  password: <%= ENV.fetch("MYSQL_PASSWORD", "porepore_password").to_json %>

development:
  <<: *default
  database: <%= ENV.fetch("MYSQL_DATABASE", "porepore_development").to_json %>

# Keep test data separate: Rails recreates this database when running tests.
test:
  <<: *default
  database: <%= ENV.fetch("MYSQL_TEST_DATABASE", "porepore_test").to_json %>
