services:
  web:
    build: .
    command: ["bash", "-c", "bin/rails db:prepare && exec bin/rails server -b 0.0.0.0"]
    environment:
      RAILS_ENV: development
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-porepore_development}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-porepore_test}
      MYSQL_USER: ${MYSQL_USER:-porepore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-porepore_password}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - .:/rails
    tmpfs:
      - /rails/tmp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-porepore_development}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-porepore_test}
      MYSQL_USER: ${MYSQL_USER:-porepore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-porepore_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
